name: Offline script checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          node --version
          python --version
          python -m unittest discover -s tests -v
          bash -n instalar.sh
          bash -n skills/auditoria-seguranca/scripts/deno-check-todas.sh
          bash -n skills/auditoria-seguranca/scripts/procurar-segredos.sh
          for script in skills/auditoria-seguranca/scripts/*.mjs; do node --check "$script"; done
          git diff --check
